{{ define "main" }}
<div class="page-wide">
  <a href="/" class="wordmark">{{ .Site.Title }}</a>
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    <p class="post-date">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
    </p>
  </header>
</div>

<div class="page-narrow">
  <div class="post-content">
    {{ .Content }}
  </div>
</div>
{{ end }}
